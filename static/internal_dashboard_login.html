<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>PropVibe - Internal</title>
  <!-- Display + body pairing (Fraunces / Plus Jakarta Sans). Loaded
       non-blocking on purpose - media="print" flipped to "all" on load - so a
       slow or unreachable CDN can never hold up first paint. If it never
       arrives, the --font-display / --font-body stacks fall back to system
       faces and the page is merely plainer, never broken. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" /></noscript>
  <style>
    /* ---- PropVibe shared design tokens (keep identical across pages). No nav
         on this page on purpose: pre-auth it must leak nothing. ---- */
    :root {
      --navy: #1a2b4c; --navy-deep: #14213a; --navy-soft: #24365c;
      --gold: #d4af37; --gold-tint: #fbf7e8; --gold-deep: #a8842a;
      --gray: #4a5568; --line: #e2e8f0; --ink: #1a202c;
      --bg: #f6f7f9; --card: #ffffff; --chip: #eef1f6; --faint: #94a3b8;
      --radius: 10px; --radius-sm: 6px; --radius-lg: 16px;
      --font-display: "Fraunces", "Iowan Old Style", Georgia, "Times New Roman", serif;
      --font-body: "Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      --shadow-sm: 0 1px 2px rgba(20, 33, 58, 0.05), 0 1px 3px rgba(20, 33, 58, 0.06);
      --shadow-md: 0 2px 4px rgba(20, 33, 58, 0.05), 0 12px 28px rgba(20, 33, 58, 0.09);
      --shadow-lg: 0 4px 8px rgba(20, 33, 58, 0.06), 0 24px 48px rgba(20, 33, 58, 0.12);
      --shadow-lift: 0 4px 10px rgba(20, 33, 58, 0.08), 0 18px 34px rgba(20, 33, 58, 0.14);
      --shadow-gold: 0 4px 14px rgba(212, 175, 55, 0.3);
      --ring-navy: 0 0 0 3px rgba(26, 43, 76, 0.12);
      --line-hover: #ccd6e6;
      --ease: cubic-bezier(0.33, 1, 0.68, 1);
      --dur-fast: 0.16s; --dur: 0.3s; --dur-slow: 0.55s;
    }
    * { box-sizing: border-box; }
    @keyframes pv-fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      font-family: var(--font-body);
      margin: 0; color: var(--ink); line-height: 1.5;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
      /* Deep navy here rather than the light app background: pre-auth this page
         should feel like a locked door, not a page of the app. */
      background:
        radial-gradient(900px 520px at 50% -10%, rgba(212, 175, 55, 0.11) 0%, rgba(212, 175, 55, 0) 62%),
        linear-gradient(160deg, var(--navy-deep) 0%, #0f1b30 100%);
    }
    .card {
      position: relative; overflow: hidden;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg);
      padding: 30px 28px 28px; width: 100%; max-width: 380px;
      box-shadow: var(--shadow-lg);
      animation: pv-fade-up var(--dur-slow) var(--ease) both;
    }
    /* Same gold sheen that caps every accented card in the app. */
    .card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--gold) 0%, var(--gold) 30%,
                  rgba(212, 175, 55, 0.35) 70%, rgba(212, 175, 55, 0.1) 100%);
    }
    .lock {
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; border-radius: 999px; margin-bottom: 14px;
      background: var(--gold-tint); border: 1px solid var(--gold);
      color: var(--gold-deep); font-size: 17px;
    }
    h1 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 600; font-size: 22px; color: var(--navy); }
    p.sub { margin: 0 0 20px; font-size: 13px; color: var(--gray); }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%; font: inherit; font-size: 14px; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card);
      outline: none;
      transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
    }
    input[type="password"]:focus {
      border-color: var(--navy); box-shadow: var(--ring-navy);
    }
    button {
      font: inherit; font-weight: 600; border: 0; border-radius: var(--radius-sm);
      padding: 12px 16px; cursor: pointer; width: 100%; margin-top: 14px;
      background: var(--navy); color: #fff;
      transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease),
                  box-shadow var(--dur-fast) var(--ease);
    }
    button:hover { background: var(--navy-soft); transform: translateY(-2px); box-shadow: var(--shadow-lift); }
    button:active { transform: translateY(0) scale(0.98); box-shadow: none; }
    .note {
      margin: 18px 0 0; font-size: 12px; color: var(--gray);
      border-top: 1px solid var(--line); padding-top: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="lock" aria-hidden="true">&#9679;</span>
    <h1>PropVibe Internal</h1>
    <p class="sub">This dashboard is restricted. Enter the internal secret to continue.</p>

    <!-- A plain GET form: the server gate accepts the secret as ?secret=, then
         sets a short-lived cookie and strips the query string from the URL. -->
    <form method="get" action="/internal-dashboard" autocomplete="off">
      <label for="secret">Internal secret</label>
      <input id="secret" name="secret" type="password" required autofocus
             autocomplete="current-password" />
      <button type="submit">Open dashboard</button>
    </form>

    <p class="note">
      Wrong or missing secret returns 401 and no data. Automated callers can send
      the secret as the <code>X-Internal-Secret</code> header instead.
    </p>
  </main>
</body>
</html>
