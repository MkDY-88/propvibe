<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PropVibe - Approve Post</title>
  <style>
    /* ---- PropVibe shared design system (keep identical across pages) ---- */
    :root {
      --navy: #1a2b4c; --navy-deep: #14213a; --navy-soft: #24365c;
      --gold: #d4af37; --gold-tint: #fbf7e8;
      --gray: #4a5568; --line: #e2e8f0; --ink: #1a202c;
      --bg: #f6f7f9; --card: #ffffff; --chip: #eef1f6; --faint: #94a3b8;
      --radius: 10px; --radius-sm: 6px;
      --shadow-sm: 0 1px 3px rgba(26, 43, 76, 0.08);
      --shadow-md: 0 10px 30px rgba(26, 43, 76, 0.08);
      --shadow-lift: 0 8px 20px rgba(26, 43, 76, 0.16);
      --ease: cubic-bezier(0.33, 1, 0.68, 1);
      --dur-fast: 0.16s; --dur: 0.3s; --dur-slow: 0.55s;
    }
    * { box-sizing: border-box; }
    @keyframes pv-fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes pv-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pv-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes pv-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    .site-nav {
      background: var(--navy-deep); border-bottom: 3px solid var(--gold);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px 16px; padding: 13px 24px;
    }
    .site-nav .brand {
      color: #fff; font-weight: 700; font-size: 17px; letter-spacing: 0.02em;
      text-decoration: none;
    }
    .site-nav .brand span { color: var(--gold); }
    .site-nav-links { display: flex; flex-wrap: wrap; gap: 4px; }
    .site-nav-links a {
      color: rgba(255, 255, 255, 0.82); text-decoration: none; font-size: 13px;
      font-weight: 600; padding: 7px 12px; border-radius: 999px;
      transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
    }
    .site-nav-links a:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
    .site-nav-links a[aria-current="page"] { background: var(--gold); color: var(--navy-deep); }
    .page-head {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-soft) 100%);
      color: #fff; padding: 20px 24px;
    }
    .page-head h1 { margin: 0; font-size: 20px; }
    .page-head p { margin: 4px 0 0; font-size: 13px; opacity: 0.8; }
    /* ---- end shared design system ---- */

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5;
    }
    main { max-width: 560px; margin: 0 auto; padding: 24px; animation: pv-fade-up var(--dur-slow) var(--ease) both; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 20px; box-shadow: var(--shadow-sm);
    }
    h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.04em;
         color: var(--gray); margin: 0 0 16px; }
    .listing-heading { margin: 0 0 2px; font-size: 18px; }
    .listing-address { margin: 0 0 12px; font-size: 13px; color: var(--gray); }
    .listing-price { font-size: 22px; font-weight: 700; color: var(--navy); margin: 0 0 4px; }
    .listing-features { font-size: 13px; color: var(--gray); margin: 0 0 16px; }
    button {
      font: inherit; font-weight: 600; border: 0; border-radius: var(--radius-sm);
      padding: 11px 16px; cursor: pointer;
      transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease),
                  transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease),
                  opacity var(--dur-fast) var(--ease);
    }
    button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-lift); }
    button:active:not(:disabled) { transform: translateY(0) scale(0.98); box-shadow: none; }
    .btn-row { display: flex; gap: 12px; margin-top: 18px; }
    .btn-row > button { flex: 1; }
    .btn-approve { background: #1877f2; color: #fff; }
    .btn-approve:disabled { background: #9db8de; cursor: not-allowed; }
    .btn-skip { background: var(--chip); color: var(--navy); }
    .btn-skip:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-edit { background: var(--chip); color: var(--navy); }
    .btn-edit:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-save { background: #1a6b3a; color: #fff; }
    .btn-save:disabled { background: #9fc7ad; cursor: not-allowed; animation: pv-pulse 1.2s ease-in-out infinite; }
    .btn-cancel { background: var(--chip); color: var(--navy); }
    #edit-panel input[type="text"], #edit-panel textarea {
      width: 100%; font: inherit; font-size: 14px; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card);
      color: var(--ink); outline: none;
      transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
    }
    #edit-panel input[type="text"]:focus, #edit-panel textarea:focus {
      border-color: var(--navy); box-shadow: 0 0 0 3px rgba(26, 43, 76, 0.12);
    }
    #edit-panel { animation: pv-fade-up var(--dur) var(--ease) both; }
    #edit-panel textarea { resize: vertical; min-height: 80px; }
    .warning {
      margin-top: 6px; padding: 8px 10px; background: #fff8e6;
      border: 1px solid #f0d78c; border-radius: var(--radius-sm); color: #8a6116; font-size: 13px;
      animation: pv-fade-up var(--dur) var(--ease) both;
    }
    #poster {
      width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block;
      margin-bottom: 16px; box-shadow: var(--shadow-sm);
    }
    .toggle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 16px; }
    .toggle-cell {
      font-size: 12px; padding: 8px 4px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--chip); color: var(--navy); cursor: pointer; text-transform: capitalize;
    }
    .toggle-cell:hover:not(:disabled) { border-color: var(--navy); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .toggle-cell.active { background: var(--navy); color: #fff; border-color: var(--navy); }
    .toggle-cell:disabled { opacity: 0.55; cursor: not-allowed; animation: pv-pulse 1.1s ease-in-out infinite; }
    .caption-box {
      white-space: pre-wrap; font-size: 14px; padding: 12px 14px; background: var(--bg);
      border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 12px;
    }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .tag {
      background: var(--chip); color: var(--navy); font-size: 13px; font-weight: 600;
      padding: 4px 9px; border-radius: 999px;
    }
    .cta {
      margin-top: 6px; padding: 10px 12px; background: var(--gold-tint);
      border: 1px solid var(--gold); border-radius: var(--radius-sm); font-weight: 600;
    }
    .muted { color: var(--gray); font-size: 13px; }
    .error {
      margin-top: 16px; padding: 12px 14px; background: #fdecec;
      border: 1px solid #f5b5b5; border-radius: var(--radius-sm); color: #9b1c1c; font-size: 14px;
      animation: pv-fade-up var(--dur) var(--ease) both;
    }
    .success {
      margin-top: 16px; padding: 12px 14px; background: #e8f5ec;
      border: 1px solid #9ed6b0; border-radius: var(--radius-sm); color: #1a6b3a; font-size: 14px;
      animation: pv-fade-up var(--dur) var(--ease) both;
    }
    .success a { color: #1877f2; font-weight: 600; }
    .hidden { display: none; }
    #result { animation: pv-fade-up var(--dur) var(--ease) both; }
    .placeholder {
      color: var(--gray); font-size: 14px; text-align: center; padding: 40px 12px;
    }
    #placeholder::before {
      content: ""; display: block; width: 28px; height: 28px; margin: 0 auto 14px;
      border-radius: 50%; border: 3px solid var(--chip); border-top-color: var(--gold);
      animation: pv-spin 0.8s linear infinite;
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="/">Prop<span>Vibe</span></a>
    <div class="site-nav-links">
      <a href="/">Home</a>
      <a href="/dashboard" aria-current="page">Dashboard</a>
      <a href="/listing">Listing</a>
      <a href="/internal-dashboard">Internal</a>
      <a href="/report">Report</a>
      <a href="/privacy">Privacy</a>
    </div>
  </nav>

  <header class="page-head">
    <h1>Agent Dashboard</h1>
    <p>The next listing is generated automatically. Review it, then Approve &amp; Post or Skip.</p>
  </header>

  <main>
    <section class="card">
      <h2>Next listing</h2>

      <div id="placeholder" class="placeholder">Finding the next listing&hellip;</div>

      <div id="result" class="hidden">
        <p class="listing-heading" id="listing-heading"></p>
        <p class="listing-address" id="listing-address"></p>
        <p class="listing-price" id="listing-price"></p>
        <p class="listing-features" id="listing-features"></p>

        <img id="poster" alt="Generated poster" />

        <label>Lighting &amp; weather</label>
        <div class="toggle-grid" id="toggle-grid">
          <button type="button" class="toggle-cell" data-time="morning" data-weather="sunny">Morning · Sunny</button>
          <button type="button" class="toggle-cell" data-time="morning" data-weather="cloudy">Morning · Cloudy</button>
          <button type="button" class="toggle-cell" data-time="morning" data-weather="rainy">Morning · Rainy</button>
          <button type="button" class="toggle-cell" data-time="evening" data-weather="sunny">Evening · Sunny</button>
          <button type="button" class="toggle-cell" data-time="evening" data-weather="cloudy">Evening · Cloudy</button>
          <button type="button" class="toggle-cell" data-time="evening" data-weather="rainy">Evening · Rainy</button>
          <button type="button" class="toggle-cell" data-time="night" data-weather="sunny">Night · Sunny</button>
          <button type="button" class="toggle-cell" data-time="night" data-weather="cloudy">Night · Cloudy</button>
          <button type="button" class="toggle-cell" data-time="night" data-weather="rainy">Night · Rainy</button>
        </div>

        <label>Caption</label>
        <div id="caption" class="caption-box"></div>
        <div id="edit-warning" class="warning hidden"></div>

        <label>Hashtags</label>
        <div id="hashtags" class="tags"></div>

        <label>Call to action</label>
        <div id="cta" class="cta"></div>

        <div class="btn-row">
          <button id="skip-btn" class="btn-skip" type="button">Skip</button>
          <button id="edit-btn" class="btn-edit" type="button">Edit</button>
          <button id="approve-btn" class="btn-approve" type="button">Approve &amp; Post</button>
        </div>

        <div id="edit-panel" class="hidden">
          <label>Caption</label>
          <textarea id="edit-caption"></textarea>

          <label>Price</label>
          <input id="edit-price" type="text" />

          <label>Location</label>
          <input id="edit-location" type="text" />

          <label>Features</label>
          <input id="edit-features" type="text" />

          <div class="btn-row">
            <button id="cancel-btn" class="btn-cancel" type="button">Cancel</button>
            <button id="save-btn" class="btn-save" type="button">Save</button>
          </div>
        </div>
      </div>

      <div id="empty" class="placeholder hidden">
        No un-posted listings remain in room_listings.csv.
      </div>

      <div id="status" class="hidden"></div>
    </section>
  </main>

  <script>
    const placeholder = document.getElementById("placeholder");
    const result = document.getElementById("result");
    const empty = document.getElementById("empty");
    const statusBox = document.getElementById("status");
    const approveBtn = document.getElementById("approve-btn");
    const skipBtn = document.getElementById("skip-btn");
    const editBtn = document.getElementById("edit-btn");
    const editPanel = document.getElementById("edit-panel");
    const editCaption = document.getElementById("edit-caption");
    const editPrice = document.getElementById("edit-price");
    const editLocation = document.getElementById("edit-location");
    const editFeatures = document.getElementById("edit-features");
    const editWarning = document.getElementById("edit-warning");
    const cancelBtn = document.getElementById("cancel-btn");
    const saveBtn = document.getElementById("save-btn");
    const toggleGrid = document.getElementById("toggle-grid");

    // Everything /publish-post needs for the listing currently on screen, plus
    // the plain-text fields (price/address/features/photo_filename) an Edit
    // needs to prefill its form and to regenerate the poster on Save.
    let current = null;

    // The caption's value at the moment Edit was opened, so Save can tell
    // whether the human touched it (used for the stale-caption warning).
    let captionAtOpen = null;

    function showStatus(className, html) {
      statusBox.className = className;
      statusBox.innerHTML = html;
    }
    function clearStatus() {
      statusBox.className = "hidden";
      statusBox.innerHTML = "";
    }

    function setButtonsDisabled(disabled) {
      approveBtn.disabled = disabled;
      skipBtn.disabled = disabled;
      editBtn.disabled = disabled;
    }

    // Repaints the card's read-only display fields from `current`. Shared by
    // the initial render and by Save, so an edit is reflected the same way a
    // freshly-loaded candidate is.
    function updateDisplayFields() {
      document.getElementById("listing-heading").textContent =
        `${current.condo_name} — ${(current.features || "").split(",")[0] || ""}`;
      document.getElementById("listing-address").textContent = current.address;
      document.getElementById("listing-price").textContent = current.price;
      document.getElementById("listing-features").textContent = current.features;

      document.getElementById("poster").src =
        "data:image/png;base64," + current.poster_base64;

      document.getElementById("caption").textContent = current.caption || "";

      const tagBox = document.getElementById("hashtags");
      tagBox.innerHTML = "";
      (current.hashtags || []).forEach((tag) => {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = "#" + tag;
        tagBox.appendChild(span);
      });

      document.getElementById("cta").textContent = current.cta || "";
    }

    function renderListing(payload) {
      current = {
        row_index: payload.row_index,
        condo_name: payload.condo_name,
        price: payload.price,
        address: payload.address,
        features: payload.features,
        photo_filename: payload.photo_filename || null,
        poster_base64: payload.poster_base64,
        caption: payload.caption || "",
        hashtags: payload.hashtags || [],
        cta: payload.cta || "",
        style_tag: payload.style_tag || null,
        template_id: payload.template_id || null,
      };

      updateDisplayFields();

      // A freshly-loaded candidate always starts on its untouched poster -
      // no combo should read as selected.
      toggleGrid.querySelectorAll(".toggle-cell").forEach((c) => c.classList.remove("active"));

      editPanel.classList.add("hidden");
      editWarning.classList.add("hidden");

      placeholder.classList.add("hidden");
      empty.classList.add("hidden");
      result.classList.remove("hidden");
      setButtonsDisabled(false);
    }

    // Fetch a candidate listing. `after` (a row_index) is set on Skip so the
    // server returns a different listing instead of the one just dismissed.
    async function loadNext(after) {
      clearStatus();
      result.classList.add("hidden");
      empty.classList.add("hidden");
      placeholder.classList.remove("hidden");
      placeholder.textContent = "Finding the next listing…";
      setButtonsDisabled(true);

      try {
        const url = after == null
          ? "/auto-create-post"
          : `/auto-create-post?after=${encodeURIComponent(after)}`;
        const resp = await fetch(url, { method: "POST" });

        if (resp.status === 404) {
          placeholder.classList.add("hidden");
          empty.classList.remove("hidden");
          return;
        }

        const payload = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          placeholder.classList.add("hidden");
          showStatus("error", payload.detail || `Request failed (HTTP ${resp.status}).`);
          return;
        }

        renderListing(payload);
      } catch (err) {
        placeholder.classList.add("hidden");
        showStatus("error", "Could not reach the server. Is the backend running?");
      }
    }

    skipBtn.addEventListener("click", () => {
      if (!current) return;
      loadNext(current.row_index);
    });

    editBtn.addEventListener("click", () => {
      if (!current) return;
      clearStatus();
      editWarning.classList.add("hidden");

      captionAtOpen = current.caption || "";
      editCaption.value = captionAtOpen;
      editPrice.value = current.price || "";
      editLocation.value = current.address || "";
      editFeatures.value = current.features || "";

      approveBtn.disabled = true;
      skipBtn.disabled = true;
      editBtn.disabled = true;
      editPanel.classList.remove("hidden");
    });

    cancelBtn.addEventListener("click", () => {
      editPanel.classList.add("hidden");
      editWarning.classList.add("hidden");
      setButtonsDisabled(false);
    });

    saveBtn.addEventListener("click", async () => {
      if (!current) return;
      clearStatus();
      editWarning.classList.add("hidden");

      const newCaption = editCaption.value;
      const newPrice = editPrice.value.trim();
      const newLocation = editLocation.value.trim();
      const newFeatures = editFeatures.value.trim();

      const priceChanged = newPrice !== (current.price || "");
      const locationChanged = newLocation !== (current.address || "");
      const featuresChanged = newFeatures !== (current.features || "");
      const posterFieldsChanged = priceChanged || locationChanged || featuresChanged;
      const captionChanged = newCaption !== captionAtOpen;

      saveBtn.disabled = true;
      cancelBtn.disabled = true;
      saveBtn.textContent = "Saving…";

      try {
        if (posterFieldsChanged) {
          const resp = await fetch("/regenerate-poster", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              photo_filename: current.photo_filename,
              price: newPrice,
              location: newLocation,
              features: newFeatures,
              style_tag: current.style_tag,
            }),
          });
          const payload = await resp.json().catch(() => ({}));
          if (!resp.ok) {
            showStatus("error", payload.detail || `Regenerating the poster failed (HTTP ${resp.status}).`);
            return; // Edit panel stays open, inputs untouched, nothing saved.
          }
          current.poster_base64 = payload.poster_base64;
          // /regenerate-poster always restarts from the untouched pool
          // photo, discarding any active AI lighting/weather edit.
          toggleGrid.querySelectorAll(".toggle-cell").forEach((c) => c.classList.remove("active"));
        }

        current.caption = newCaption;
        current.price = newPrice;
        current.address = newLocation;
        current.features = newFeatures;

        updateDisplayFields();

        // Price changed but the caption wasn't touched - flag it for a human
        // to double check, without blocking Save or Approve & Post.
        if (priceChanged && !captionChanged) {
          editWarning.textContent = "Price changed — check the caption still matches.";
          editWarning.classList.remove("hidden");
        }

        editPanel.classList.add("hidden");
        // Only re-enable Skip/Approve/Edit once the edit panel actually
        // closes - on the early-return error path above it stays open, so
        // those three stay disabled until the human saves again or cancels.
        setButtonsDisabled(false);
      } catch (err) {
        showStatus("error", "Could not reach the server. Is the backend running?");
      } finally {
        saveBtn.disabled = false;
        cancelBtn.disabled = false;
        saveBtn.textContent = "Save";
      }
    });

    toggleGrid.addEventListener("click", async (event) => {
      const btn = event.target.closest(".toggle-cell");
      if (!btn || !current) return;
      clearStatus();

      const cells = [...toggleGrid.querySelectorAll(".toggle-cell")];
      cells.forEach((c) => (c.disabled = true));
      setButtonsDisabled(true);
      const original = btn.textContent;
      btn.textContent = "Generating…";

      try {
        const resp = await fetch("/toggle-photo-condition", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            photo_filename: current.photo_filename,
            time_of_day: btn.dataset.time,
            weather: btn.dataset.weather,
            price: current.price,
            location: current.address,
            features: current.features,
            style_tag: current.style_tag,
          }),
        });
        const payload = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          showStatus("error", payload.detail || `Toggling the photo failed (HTTP ${resp.status}).`);
          return;
        }

        // Same mechanism as Save: mutate current.poster_base64 and repaint -
        // Approve & Post reads current.poster_base64 fresh at click time, so
        // this alone makes it publish whichever toggle is on screen.
        current.poster_base64 = payload.poster_base64;
        updateDisplayFields();
        cells.forEach((c) => c.classList.toggle("active", c === btn));
      } catch (err) {
        showStatus("error", "Could not reach the server. Is the backend running?");
      } finally {
        btn.textContent = original;
        cells.forEach((c) => (c.disabled = false));
        setButtonsDisabled(false);
      }
    });

    approveBtn.addEventListener("click", async () => {
      if (!current) return;
      clearStatus();
      setButtonsDisabled(true);
      approveBtn.textContent = "Posting…";

      try {
        const resp = await fetch("/publish-post", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            poster_base64: current.poster_base64,
            caption: current.caption,
            hashtags: current.hashtags,
            cta: current.cta,
            style_tag: current.style_tag,
            template_id: current.template_id,
            listing_row_index: current.row_index,
            photo_filename: current.photo_filename,
          }),
        });
        const payload = await resp.json().catch(() => ({}));

        if (!resp.ok) {
          showStatus("error", payload.detail || `Publishing failed (HTTP ${resp.status}).`);
          setButtonsDisabled(false);
          approveBtn.textContent = "Approve & Post";
          return;
        }

        showStatus(
          "success",
          `<strong>Posted to Facebook!</strong> <a href="${payload.post_url}" target="_blank" rel="noopener noreferrer">View the post</a>`
        );
        approveBtn.textContent = "Approve & Post";
        // Move straight on to the next candidate - this is the single-click
        // approve step; there is nothing else for a human to do here.
        loadNext(current.row_index);
      } catch (err) {
        showStatus("error", "Could not reach the server. Is the backend running?");
        setButtonsDisabled(false);
        approveBtn.textContent = "Approve & Post";
      }
    });

    loadNext(null);
  </script>
</body>
</html>
